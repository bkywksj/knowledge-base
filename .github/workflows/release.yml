# =============================================================================
# Tauri 跨平台自动构建 & 发布工作流
# =============================================================================
#
# 触发方式：推送 v*.*.* 格式的 Git Tag
#   git tag v1.0.0
#   git push <remote> v1.0.0
#
# 前提条件（GitHub Secrets）：
#   - TAURI_SIGNING_PRIVATE_KEY       签名私钥内容
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（通常为空）
#
# 可选（GitHub Secrets）—— macOS Developer ID 签名 + 公证，配了就签，没配就出 ad-hoc 版（不报错）：
#   - APPLE_CERTIFICATE             Developer ID Application 证书 .p12 的 base64
#   - APPLE_CERTIFICATE_PASSWORD    .p12 导出密码
#   - APPLE_SIGNING_IDENTITY        如 "Developer ID Application: XXX (TEAMID)"
#   - APPLE_ID / APPLE_PASSWORD     公证用 Apple ID + App 专用密码
#   - APPLE_TEAM_ID                 团队 ID
#   本仓是开源公开仓：证书 / 密码只进 Secrets，永不入库；fork 发起的 PR 拿不到 Secrets，
#   且本 workflow 只在推 tag 时触发。入库的只有非机密配置（Entitlements.plist、Info.plist、
#   tauri.conf.json 的 bundle.macOS 段）。signingIdentity 故意不写进 tauri.conf.json，
#   这样别人 clone 下来本地构建时没证书会自动退回 ad-hoc，照常能编。
#
# 使用前须修改（搜索 TODO 标记）：
#   1. releaseName: 修改为你的应用名称
#   2. 构建矩阵: 根据 .claude/release-config.json 的 platforms 配置
#      裁剪不需要的平台（删除对应 matrix include 条目）
#
# CI 只负责构建和上传到 GitHub Release（草稿）。
# 产物下载和推送到 release 仓库由本地 /release 命令完成。
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # 桌面三平台。移动端走 `mobile-v*.*.*` tag + android.yml，前缀不同不会撞到这里。

jobs:
  # ===========================================================================
  # Job 0: 预创建 draft release + 计算构建矩阵
  #
  # 1) 预创建 draft release：杜绝 4 个 build job 并发 create release 时撞
  #    GitHub API race（"Server Error" / "Error updating policy"）。让所有
  #    build job needs 它，启动时 release 已存在，tauri-action 直接复用并上传。
  #
  # 2) 动态矩阵：按仓库变量 RELEASE_WINDOWS 决定是否让 CI 构建 Windows。
  #      未设 / build → 含 Windows（默认＝现状，向后兼容）
  #      skip         → 不含 Windows（Windows 安装包改由发版机本地构建提供，
  #                     CI 不起 windows runner，省 ~12 分钟 Actions 额度）
  #    设置方式：仓库 Settings → Secrets and variables → Actions → Variables，
  #    或 `gh variable set RELEASE_WINDOWS --repo <owner/repo> -b skip`。
  # ===========================================================================
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skip"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "知识库 $TAG" \
              --notes "See the assets to download and install this version."
            echo "Created draft release $TAG"
          fi

      - name: Compute build matrix
        id: set-matrix
        shell: bash
        env:
          RELEASE_WINDOWS: ${{ vars.RELEASE_WINDOWS }}
        run: |
          WIN='{"platform":"windows-latest","args":"--bundles nsis"}'
          MAC_ARM='{"platform":"macos-latest","args":"--bundles app,dmg","target":"aarch64-apple-darwin"}'
          MAC_X64='{"platform":"macos-latest","args":"--bundles app,dmg","target":"x86_64-apple-darwin"}'
          LINUX='{"platform":"ubuntu-22.04","args":"--bundles deb,appimage"}'
          if [ "$RELEASE_WINDOWS" = "skip" ]; then
            echo "跳过 Windows CI 构建（RELEASE_WINDOWS=skip，Windows 由发版机本地构建提供）"
            INCLUDE="[$MAC_ARM,$MAC_X64,$LINUX]"
          else
            echo "含 Windows CI 构建（RELEASE_WINDOWS='${RELEASE_WINDOWS:-unset}'）"
            INCLUDE="[$WIN,$MAC_ARM,$MAC_X64,$LINUX]"
          fi
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 1: 跨平台构建
  # ===========================================================================
  release:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 矩阵由 prepare-release 动态生成（受仓库变量 RELEASE_WINDOWS 控制是否含 Windows）
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      # ─── kb-mcp sidecar：MCP server binary，由 Tauri externalBin 带进安装包 ───
      # 必须在 tauri build 之前完成，否则 bundle 阶段找不到 binaries/kb-mcp-<triple>(.exe)
      # macOS 矩阵会传 --target，让 sidecar binary 与 tauri build 同 triple 对齐
      - name: Build kb-mcp sidecar
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            pnpm build:mcp --target ${{ matrix.target }}
          else
            pnpm build:mcp
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # 放开 Node 堆上限：tauri build 的 beforeBuildCommand 会跑 `vite build`，
          # 而 macOS runner 上 Node 的默认 old-space 上限只有 ~2GB。自 v1.50.0 引入
          # Excalidraw（白板）后前端涨到 9600+ 模块，terser 压缩阶段堆峰值越过 2GB，
          # 两个 mac job 齐刷刷 "FATAL ERROR: Reached heap limit"（exit 134）而
          # Linux / Windows runner 默认上限更高才侥幸通过。显式设 8GB 覆盖全平台。
          NODE_OPTIONS: '--max-old-space-size=8192'
          # macOS 代码签名 + 公证（Developer ID，仅 macos-latest runner 生效，Win/Linux 忽略）。
          # tauri-action 检测到 APPLE_CERTIFICATE 会自动导入临时 keychain 并签 .app / sidecar / dmg；
          # APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID 触发 notarytool 公证 + staple。
          # 为什么必须签：ad-hoc 签名下 macOS「本地网络」授权不稳定（每次打包都像新应用），
          # 导致 WebDAV 填内网 NAS 地址时 Mac 端瞬间失败、Windows 正常（2026-10 用户实录）。
          # tauri-action 签了但公证失败时 job 仍会 success —— 由下一步「Verify macOS signature & notarization」卡住。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '知识库 ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # 公证校验：配了 APPLE_* 就必须真的「Developer ID 签名 + 公证 + 钉票」成功，否则让 job 失败，
      # 而不是把一个 Gatekeeper 拦截 / 本地网络授权不稳的包悄悄发出去。
      # 没配 APPLE_*（如新开的备用 CI 仓忘了灌 Secrets）只出警告、不失败 —— 与改动前行为一致，
      # 但警告会出现在 run 的 Annotations 里，发版步骤 6 会检查它。
      - name: Verify macOS signature & notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -uo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning title=macOS 未签名::本仓未配置 APPLE_* secrets，${{ matrix.target }} 产物为 ad-hoc 签名（未公证）。用户首次打开会被 Gatekeeper 拦截，且「本地网络」授权不稳定（内网 WebDAV 同步会失败）。"
            exit 0
          fi

          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::在 $BUNDLE/macos 下找不到 .app"; exit 1
          fi
          echo "检查: $APP"

          echo "== 1/3 签名完整性（含 kb-mcp sidecar 等嵌套二进制）=="
          codesign --verify --deep --strict --verbose=2 "$APP" || { echo "::error::codesign 校验失败"; exit 1; }
          codesign -dv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Runtime)"
          codesign -dv "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::.app 不是 Developer ID 签名（证书未导入或 APPLE_SIGNING_IDENTITY 不对）"; exit 1; }

          if [ -z "$APPLE_ID" ]; then
            echo "::warning title=macOS 未公证::已 Developer ID 签名，但未配 APPLE_ID，未公证。"
            exit 0
          fi

          echo "== 2/3 Gatekeeper（公证通过才会是 source=Notarized Developer ID）=="
          GK=$(spctl --assess --type execute -vv "$APP" 2>&1); echo "$GK"
          echo "$GK" | grep -q "source=Notarized Developer ID" \
            || { echo "::error::.app 未通过公证（到 tauri-action 步骤日志里搜 notarytool 查看拒绝原因）"; exit 1; }

          echo "== 3/3 公证票据已钉入（离线首次打开也不被拦）=="
          xcrun stapler validate "$APP" || { echo "::error::.app 未钉入公证票据"; exit 1; }

          echo "✓ ${{ matrix.target }}：Developer ID 签名 + 公证 + 票据均通过"

  # ===========================================================================
  # 注意：CI 只负责构建和上传到 GitHub Release（草稿）。
  # 产物下载、复制到 release 仓库、生成 update.json、推送到 Gitee/GitHub
  # 均由本地 /release 命令完成（避免 CI 跨国推送 Gitee 超时问题）。
  # ===========================================================================
