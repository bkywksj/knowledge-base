<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sigil 应用图标母版 —— 按顶栏左上角 Logo（Sidebar.tsx 的 BrandLogo + global.css 的 .sigil-logo）等比放大：
  26px 底块 → 1024；圆角 7.5px → 295；渐变 linear-gradient(150deg, #22b8cf, #0b7f9e)；
  钥匙 = lucide「key」15px（→ 591，占底块约 57%）居中、rotate(-45deg)、描边 2.4、圆头圆角；
  顶边 inset 0 1px 0 rgba(255,255,255,.25) 高光 → 顶部一道 14px 的白色半透明亮边。
  改这里要同步左上角 Logo，反之亦然；改完用 Edge 无头渲染成 1024 透明底 PNG，再 `pnpm tauri icon <png>`。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- CSS 150deg 渐变线：方向 (sin150°, -cos150°) = (0.5, 0.866)，半长 (1024·sin + 1024·|cos|)/2 ≈ 699 -->
    <linearGradient id="gGlacier" gradientUnits="userSpaceOnUse" x1="162.3" y1="-93.7" x2="861.7" y2="1117.7">
      <stop offset="0" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#0b7f9e"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="295" ry="295"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- 渐变铺满 → 盖一层白色半透明 → 渐变底块下移 14px 再盖上去：露出的是沿圆角走的一道弧形亮边，
         与 CSS 的 inset 0 1px 0 高光同一效果（底部被下移的底块完全盖住，不会多出亮边） -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#gGlacier)"/>
    <rect x="0" y="0" width="1024" height="1024" rx="295" ry="295" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="0" y="14" width="1024" height="1024" rx="295" ry="295" fill="url(#gGlacier)"/>
  </g>
  <!-- lucide「key」（lucide-react 0.577.0，viewBox 0 0 24 24），按 15/26 的比例放大并倾斜 -45° -->
  <g transform="translate(512 512) rotate(-45) scale(24.6) translate(-12 -12)"
     fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/>
    <path d="m21 2-9.6 9.6"/>
    <circle cx="7.5" cy="15.5" r="5.5"/>
  </g>
</svg>
