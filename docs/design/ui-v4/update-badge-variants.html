<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更新徽章 · 进度填充方案</title>
<style>
  /* 令牌取自 src/styles/themes.css：light-lilac / dark-ember */
  .t-light {
    --kb-primary: #7C63DC;
    --kb-primary-light: rgba(124,99,220,0.08);
    --kb-text-primary: #27233B;
    --kb-text-tertiary: #9C96B4;
    --kb-border: rgba(110,85,200,0.14);
    --kb-grad: linear-gradient(135deg, #B3A3F6 0%, #937BE9 45%, #7C63DC 100%);
    --bar: #ECE8F8;
  }
  .t-dark {
    --kb-primary: #A992FA;
    --kb-primary-light: rgba(169,146,250,0.12);
    --kb-text-primary: #EFEBE4;
    --kb-text-tertiary: #958F85;
    --kb-border: rgba(255,245,230,0.09);
    --kb-grad: linear-gradient(135deg, #9C86F2 0%, #8269E4 45%, #6C52D2 100%);
    --bar: #24221F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 48px;
    font-family: "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    background: #F6F4FB;
    color: #27233B;
  }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: #6E6888; font-size: 13px; }
  header label { margin-left: auto; font-size: 13px; color: #6E6888; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 14px; padding: 16px 18px 18px; box-shadow: 0 0 0 1px rgba(110,85,200,.12), 0 8px 24px -14px rgba(110,85,200,.2); }
  .card h2 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card h2 b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: #7C63DC; color: #fff; font-size: 12px; }
  .card > p { margin: 0 0 12px; font-size: 12px; color: #6E6888; line-height: 1.6; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 4px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bar); }
  .bar + .bar { margin-top: 8px; }

  /* ── 胶囊基础（同 global.css .kb-upd） ── */
  .kb-upd {
    position: relative; overflow: hidden; isolation: isolate;
    height: 24px; display: inline-flex; align-items: center; gap: 5px;
    padding: 0 10px; margin: 0 6px 0 4px; border: none; border-radius: 999px;
    font: inherit; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums; cursor: pointer;
    color: var(--kb-primary);
    background: color-mix(in srgb, var(--kb-primary) 6%, transparent);
    box-shadow: 0 0 0 0.5px color-mix(in srgb, var(--kb-primary) 45%, transparent);
  }
  .kb-upd .c { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 5px; }
  .kb-upd i.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .kb-upd .from { color: var(--kb-text-tertiary); font-weight: 500; }
  .kb-upd em { font-style: normal; font-weight: 500; }
  .fill, .inv { position: absolute; inset: 0 auto 0 0; pointer-events: none; }
  .fill { z-index: 1; width: var(--p); transition: width .6s ease; }
  .inv { display: none; }
  .paused { --pz: 1; }

  /* ── A 细纹 · 低调 ── */
  .vA .fill {
    --l: color-mix(in srgb, var(--kb-primary) 13%, transparent);
    --d: color-mix(in srgb, var(--kb-primary) 21%, transparent);
    background-color: var(--l);
    background-image: linear-gradient(45deg, var(--d) 25%, transparent 25%, transparent 50%, var(--d) 50%, var(--d) 75%, transparent 75%, transparent);
    background-size: 10px 10px;
    animation: slideA 1.4s linear infinite;
  }
  /* 正方形图块里 45° 斜纹首尾相接，平移一个图块 = 无缝循环 */
  @keyframes slideA { from { background-position: 0 0; } to { background-position: 10px 0; } }
  .vA.paused .fill { --l: color-mix(in srgb, var(--kb-text-tertiary) 14%, transparent); --d: color-mix(in srgb, var(--kb-text-tertiary) 24%, transparent); animation: none; }

  /* ── B 宽纹 · 柔边 ── */
  .vB .fill {
    --l: color-mix(in srgb, var(--kb-primary) 8%, transparent);
    --d: color-mix(in srgb, var(--kb-primary) 34%, transparent);
    background-image: linear-gradient(45deg, var(--l) 0%, var(--d) 25%, var(--l) 50%, var(--d) 75%, var(--l) 100%);
    background-size: 24px 24px;
    animation: slideB 1.8s linear infinite;
  }
  @keyframes slideB { from { background-position: 0 0; } to { background-position: 24px 0; } }
  .vB.paused .fill { --l: color-mix(in srgb, var(--kb-text-tertiary) 12%, transparent); --d: color-mix(in srgb, var(--kb-text-tertiary) 26%, transparent); animation: none; }

  /* ── C 实色 + 白斜纹 + 反白文字 ── */
  .vC .inv {
    display: block; z-index: 3; width: 100%;
    clip-path: inset(0 calc(100% - var(--p)) 0 0);
    transition: clip-path .6s ease;
    background: var(--kb-grad);
    color: #fff;
  }
  .vC .inv::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(45deg, rgba(255,255,255,.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.2) 50%, rgba(255,255,255,.2) 75%, transparent 75%, transparent);
    background-size: 14px 14px;
    animation: slideC 1s linear infinite;
  }
  @keyframes slideC { from { background-position: 0 0; } to { background-position: 14px 0; } }
  .vC .inv .c { position: absolute; inset: 0; padding: 0 10px; }
  .vC .inv .from { color: rgba(255,255,255,.75); }
  .vC .fill { display: none; }
  .vC.paused .inv { background: linear-gradient(135deg, #B9B4C9, #9C96B4); }
  .vC.paused .inv::before { animation: none; }
  .t-dark .vC.paused .inv { background: linear-gradient(135deg, #6E6A63, #57534D); }

  /* ── D 渐变 + 扫光（无斜纹） ── */
  .vD .fill {
    background:
      linear-gradient(100deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%) no-repeat,
      linear-gradient(90deg, color-mix(in srgb, var(--kb-primary) 10%, transparent), color-mix(in srgb, var(--kb-primary) 30%, transparent));
    background-size: 40% 100%, 100% 100%;
    animation: shineD 1.8s ease-in-out infinite;
  }
  .t-dark .vD .fill { background-image: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%), linear-gradient(90deg, color-mix(in srgb, var(--kb-primary) 12%, transparent), color-mix(in srgb, var(--kb-primary) 34%, transparent)); }
  @keyframes shineD { from { background-position: -60% 0, 0 0; } to { background-position: 160% 0, 0 0; } }
  .vD.paused .fill { background: color-mix(in srgb, var(--kb-text-tertiary) 22%, transparent); animation: none; }

  /* ── E 柔色填充 + 前沿斜纹 ── */
  .vE .fill {
    background: color-mix(in srgb, var(--kb-primary) 16%, transparent);
  }
  .vE .fill::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 26px;
    background-image: linear-gradient(45deg, color-mix(in srgb, var(--kb-primary) 34%, transparent) 25%, transparent 25%, transparent 50%, color-mix(in srgb, var(--kb-primary) 34%, transparent) 50%, color-mix(in srgb, var(--kb-primary) 34%, transparent) 75%, transparent 75%, transparent);
    background-size: 10px 10px;
    -webkit-mask: linear-gradient(90deg, transparent, #000);
            mask: linear-gradient(90deg, transparent, #000);
    animation: slideA 1s linear infinite;
  }
  .vE .fill::before {
    content: ""; position: absolute; top: 3px; bottom: 3px; right: 0; width: 2px; border-radius: 2px;
    background: var(--kb-primary); opacity: .55;
  }
  .vE.paused .fill { background: color-mix(in srgb, var(--kb-text-tertiary) 20%, transparent); }
  .vE.paused .fill::after { display: none; }
  .vE.paused .fill::before { background: var(--kb-text-tertiary); }
  .vE.verifying .fill::before { display: none; }

  /* ── F 分段格 ── */
  .vF .fill {
    width: 100%;
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--kb-primary) 26%, transparent) 0 var(--p), transparent var(--p));
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 2px), transparent calc(10% - 2px) 10%);
            mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 2px), transparent calc(10% - 2px) 10%);
    transition: none;
  }
  .vF .fill::after {
    /* 正在填的那一格呼吸 */
    content: ""; position: absolute; top: 0; bottom: 0;
    left: calc(var(--seg) * 10%); width: 10%;
    background: color-mix(in srgb, var(--kb-primary) 26%, transparent);
    animation: pulseF 1s ease-in-out infinite;
  }
  @keyframes pulseF { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  .vF.paused .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--kb-text-tertiary) 30%, transparent) 0 var(--p), transparent var(--p)); }
  .vF.paused .fill::after, .vF.verifying .fill::after { display: none; }

  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: #9C96B4; }
  .legend span { padding: 2px 8px; border-radius: 99px; background: #F3F0FB; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>更新徽章 · 进度填充方案</h1>
  <p>每种方案：35% / 72% / 已暂停 / 校验中；上浅色（淡紫）下深色（暖炭）</p>
  <label><input type="checkbox" id="auto"> 自动演示（前两个徽章循环 0→100%）</label>
</header>

<div class="grid" id="grid"></div>

<template id="badge">
  <button class="kb-upd">
    <span class="fill"></span>
    <span class="inv"><span class="c"><i class="dot"></i><span class="from">v3.0.0</span>→<b>v3.1.0</b><em class="tail"></em></span></span>
    <span class="c"><i class="dot"></i><span class="from">v3.0.0</span>→<b>v3.1.0</b><em class="tail"></em></span>
  </button>
</template>

<script>
  const VARIANTS = [
    ["A", "细纹 · 低调", "窄斜纹（3px 深 / 4px 浅）、同色系低对比，慢速平移。最安静，远看接近一块浅色填充。"],
    ["B", "宽纹 · 柔边", "宽斜纹、深浅之间是渐变过渡而不是硬边，像缎带上的光泽，比硬斜纹柔和。"],
    ["C", "实色 + 反白文字", "已下载部分是主题渐变实色 + 半透明白斜纹，压在上面的文字自动反白。最醒目，最像「真正的进度条」。"],
    ["D", "渐变 + 扫光", "不用斜纹：从左到右由浅到深的渐变，一道高光反复扫过表示在下载。"],
    ["E", "柔色填充 + 前沿斜纹", "已下载部分是干净的浅色块，只有最前沿 26px 有渐隐斜纹在流动，加一条细细的进度线。"],
    ["F", "分段格", "胶囊分成 10 格，每 10% 点亮一格，正在填的那一格呼吸闪烁。"],
  ];
  const STATES = [
    { p: 35, tail: "· 35%", cls: "" },
    { p: 72, tail: "· 72%", cls: "" },
    { p: 50, tail: "· 已暂停", cls: "paused" },
    { p: 100, tail: "· 校验中", cls: "verifying" },
  ];
  const tpl = document.getElementById("badge");
  const grid = document.getElementById("grid");
  const live = [];

  function makeBadge(v, s) {
    const b = tpl.content.firstElementChild.cloneNode(true);
    b.classList.add("v" + v);
    if (s.cls) b.classList.add(s.cls);
    setProgress(b, s.p, s.tail);
    return b;
  }
  function setProgress(b, p, tail) {
    b.style.setProperty("--p", p + "%");
    b.style.setProperty("--seg", Math.min(9, Math.floor(p / 10)));
    b.querySelectorAll(".tail").forEach((e) => (e.textContent = " " + tail));
  }

  for (const [v, name, desc] of VARIANTS) {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2><b>${v}</b>${name}</h2><p>${desc}</p>`;
    for (const theme of ["t-light", "t-dark"]) {
      const bar = document.createElement("div");
      bar.className = "bar " + theme;
      STATES.forEach((s, i) => {
        const b = makeBadge(v, s);
        if (i < 2) live.push({ b, base: s.p });
        bar.appendChild(b);
      });
      card.appendChild(bar);
    }
    grid.appendChild(card);
  }

  // 自动演示：前两个徽章循环 0→100%，看填充增长和动画
  let timer = null;
  document.getElementById("auto").addEventListener("change", (e) => {
    clearInterval(timer);
    if (!e.target.checked) {
      live.forEach(({ b, base }) => setProgress(b, base, `· ${base}%`));
      return;
    }
    let p = 0;
    timer = setInterval(() => {
      p = p >= 100 ? 0 : p + 1;
      live.forEach(({ b }) => setProgress(b, p, `· ${p}%`));
    }, 80);
  });
</script>
</body>
</html>
