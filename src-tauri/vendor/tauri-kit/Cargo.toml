[package]
name = "tauri-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "internal shared desktop library"
# 私有库：不发 crates.io，源码由 tools/vendor-into.sh 内置到自有应用的 src-tauri/vendor/tauri-kit。

[features]
default = []
# 每个模块一个 feature，应用只开自己用的，没开的不参与编译。
window-memory = ["dep:tauri", "dep:log", "dep:tokio", "dep:windows-sys"]
# 主窗口里挂了子 webview（内置浏览器标签页）的应用要开：这时 get_webview_window 找不到主窗口
child-webviews = ["window-memory", "tauri/unstable"]
# 外网请求认 socks5 代理 + 国内服务先直连（见 src/net）。用 reqwest 0.12 发请求的应用开这个
net = ["net-socks", "dep:reqwest", "dep:log"]
# 只给 reqwest 0.13（tauri-plugin-updater 用的那份）打开 socks：给没用 reqwest 0.12 的应用，开了检查更新就不再挂
net-socks = ["dep:reqwest013"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", optional = true }
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
# 下限 2.10：用到的 Monitor::work_area 在各应用锁定的最低版本里已有
tauri = { version = "2.10", default-features = false, features = ["wry"], optional = true }
# 两个 reqwest 都只开 socks，TLS 由应用自己选。这里声明 socks 是为了让 Cargo 把它合并到应用里同版本的 reqwest 上：
# 没开 socks 时 reqwest 照样读 ALL_PROXY=socks5://…，然后把它当 HTTP 代理建隧道，必报 unsupported scheme socks5。
# socks 特性不引入新 crate（用 hyper-util 自带的实现）。
reqwest = { version = "0.12", default-features = false, features = ["socks"], optional = true }
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
